name: Test and deploy GitHub Pages

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Verify ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - name: units
            script: test
          - name: updates-signup
            script: test:updates
          - name: tv-controls
            script: test:tv-controls
          - name: first-sheet-guide
            script: test:first-sheet-guide
          - name: interaction
            script: test:interaction
          - name: visual
            script: test:visual
          - name: performance
            script: test:performance
          - name: landing
            script: test:landing
          - name: room-decor
            script: test:room-decor
          - name: release-ui
            script: test:release-ui
          - name: workbench
            script: test:workbench
          - name: offline
            script: test:offline
          - name: community-preview
            script: test:community-preview
          - name: writing-board-preview
            script: test:writing-board-preview
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify release package
        run: npm run build:release

      - name: Run ${{ matrix.name }} checks
        run: npm run ${{ matrix.script }}

      - name: Save structured check evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-${{ matrix.name }}
          path: visual-checks/**/*.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    if: github.ref == 'refs/heads/main'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm browser runtime
        run: google-chrome --version

      - name: Build verified release
        run: npm run build:release

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
