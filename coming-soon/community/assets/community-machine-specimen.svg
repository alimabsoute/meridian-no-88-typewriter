<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Archival typewriter specimen</title>
  <desc id="desc">A detailed black enamel manual typewriter on an oval desk shadow, with aged paper, carriage rails, ribbon spools, and rows of keys.</desc>
  <defs>
    <linearGradient id="enamel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50574c"/>
      <stop offset="0.18" stop-color="#252a23"/>
      <stop offset="0.66" stop-color="#10130f"/>
      <stop offset="1" stop-color="#050705"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#eee4c9"/>
      <stop offset="1" stop-color="#c9b991"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#6c5a37"/>
      <stop offset="0.35" stop-color="#d0af69"/>
      <stop offset="0.7" stop-color="#82704b"/>
      <stop offset="1" stop-color="#3a3325"/>
    </linearGradient>
    <radialGradient id="key" cx="40%" cy="30%" r="75%">
      <stop stop-color="#f1e8d1"/>
      <stop offset="0.68" stop-color="#b9ad91"/>
      <stop offset="0.72" stop-color="#35362f"/>
      <stop offset="1" stop-color="#11130f"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <pattern id="keys" width="55" height="45" patternUnits="userSpaceOnUse">
      <circle cx="27" cy="22" r="18" fill="url(#key)" stroke="#070807" stroke-width="4"/>
      <circle cx="27" cy="22" r="9" fill="none" stroke="#6d6656" stroke-width="1" opacity=".65"/>
    </pattern>
  </defs>

  <ellipse cx="450" cy="552" rx="355" ry="45" fill="#000" opacity=".52" filter="url(#shadow)"/>

